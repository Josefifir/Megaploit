# plugins/native_sdk/example_native.toml
# =========================================
# Example plugin descriptor for a "native" (C / C++) command.
#
# Drop this file (and the matching source file) into your plugins/ directory.
# The runner will compile the source automatically on first use and recompile
# whenever the source file is newer than the cached binary.

[plugin]
name        = "example-native"
version     = "1.0.0"
author      = "Your Name"
description = "Demonstrates a native C++ plugin with TCP port probing."
tags        = ["network", "example", "native"]

# ── Command ──────────────────────────────────────────────────────────────

[[command]]
name        = "tcpprobe"
kind        = "native"
description = "TCP connect-probe a host:port from the operator machine (C++ native plugin)"
usage       = "tcpprobe <host> <port> [timeout_secs]"
min_args    = 2
max_args    = 3

# Path to the C++ source file — relative paths are resolved from the
# working directory where Megaploit is started.
source_file = "plugins/native_sdk/example_plugin.cpp"

# Optional: extra flags passed verbatim to the compiler.
# "-std=c++17" is the default for g++; add "-lws2_32" on Windows with MinGW.
# compiler_flags = "-std=c++17 -O2"

# The runner expands {arg0}, {arg1}, {arg2} and passes them as argv[1..3].
# For "native" kind the args are forwarded automatically — no shell= needed.

timeout     = 15       # seconds; 0 = no limit
dangerous   = false
output_format = "raw"
tags        = ["network"]
notes       = """
Compiles plugins/native_sdk/example_plugin.cpp on first run (requires gcc/g++ or clang/clang++).
The cached binary is stored next to the source and recompiled automatically
when the source file changes (mtime-based, like make).

Pitfalls for C/C++/C# agents connecting to the C2 server:
  - All integers (length prefix, sequence number) are BIG-ENDIAN.
  - Every message payload starts with an 8-byte uint64 sequence number.
  - The JSON payload must be a JSON *string*, not an object or array.
  - AES-256-GCM: nonce (12 bytes) prepends the ciphertext+tag (16 bytes).
  - Sequence numbers are strictly monotonic; duplicates are rejected.
See plugins/native_sdk/megaploit_protocol.h for the complete reference.
"""
