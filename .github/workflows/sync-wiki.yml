name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push wiki/ to GitHub wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the wiki repo (fails if wiki has never had a page — create Home.md first via UI)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki_repo

          # Copy all pages from wiki/ into the wiki repo root
          cp wiki/*.md wiki_repo/

          cd wiki_repo
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push."
          else
            git commit -m "docs: sync wiki from main ($(date -u +%Y-%m-%d))"
            git push
          fi
