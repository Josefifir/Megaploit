# =============================================================================
#  Megaploit — Docker Compose
#
#  Interactive C2 operator console with persistent operator state.
#
#  Quick start:
#      LHOST=192.168.1.10 docker compose run --rm --service-ports megaploit
#
#  Background service (non-interactive listener only):
#      LHOST=192.168.1.10 docker compose up -d
#
#  Stop:
#      docker compose down
#
#  One-off commands:
#      docker compose run --rm megaploit pytest
#      docker compose run --rm megaploit bash
#
#  All operator state (secret.key, loot/, tools/, settings) persists in the
#  `megaploit-data` named volume across container restarts.
# =============================================================================

services:
  megaploit:
    build:
      context: .
      dockerfile: Dockerfile
      # Uncomment to bundle the Go toolchain (+~700 MB) for go_exe / go_elf:
      # args:
      #   INSTALL_GO: "1"
    image: megaploit:latest
    container_name: megaploit

    # Interactive REPL — needs a TTY + stdin open.
    stdin_open: true
    tty: true

    environment:
      # IP the agent connects back to — set this to your reachable LAN/VPN IP.
      LHOST: ${LHOST:-127.0.0.1}
      # C2 listener port (must match the left side of the port mapping below).
      PORT: ${PORT:-4444}
      # Listener bind address (0.0.0.0 so published host ports work).
      RHOST: ${RHOST:-0.0.0.0}
      # TLS options (choose one):
      #   Option A — auto-generate a self-signed cert at startup:
      #     USE_TLS: "1"
      #   Option B — drop cert.pem + key.pem into the volume, then set USE_TLS=1.
      #     The entrypoint detects them automatically.

    ports:
      - "${PORT:-4444}:${PORT:-4444}"   # C2 listener (agent callback)
      - "8080:8080"                      # Web dashboard (web start --host 0.0.0.0)
      - "7777:7777"                      # Multi-operator RPC (rpc start --host 0.0.0.0)

    volumes:
      # Named volume — all operator state persists here.
      # Windows/macOS Docker Desktop: use named volumes (not bind mounts) to
      # avoid permission issues.
      - megaploit-data:/data

    # Health-check: TCP probe of the C2 listener port.
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import socket,os; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',int(os.getenv('PORT','4444')))); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

volumes:
  megaploit-data:
    # To inspect the volume: docker volume inspect megaploit_megaploit-data
    # To back it up:         docker run --rm -v megaploit_megaploit-data:/data -v $(pwd):/backup \
    #                          alpine tar czf /backup/megaploit-data.tar.gz /data
