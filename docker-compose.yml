# ─── Megaploit — Docker Compose stack ────────────────────────────────────────
#
# Usage:
#   # First time — generate a secret key:
#   python3 -c "import os,binascii; open('secret.key','wb').write(binascii.hexlify(os.urandom(32)))"
#
#   # Start:
#   LHOST=192.168.1.10 docker compose up
#
#   # Persistent background run:
#   LHOST=192.168.1.10 docker compose up -d
#
#   # Stop:
#   docker compose down
#
# All collected loot lands in ./loot/ on the host.
# ──────────────────────────────────────────────────────────────────────────────

services:
  megaploit:
    build: .
    image: megaploit:latest
    container_name: megaploit

    # Forward C2 listener port.  Change the left side to remap to a different
    # host port, e.g. "443:4444" to receive callbacks on port 443.
    ports:
      - "${C2_PORT:-4444}:4444"

    # LHOST is the IP/hostname the agent will connect BACK to — i.e. your
    # machine's reachable address from the target network, NOT the container IP.
    # Set it via:  LHOST=10.0.0.1 docker compose up
    environment:
      - LHOST=${LHOST:-127.0.0.1}
      - C2_PORT=${C2_PORT:-4444}

    # Persist loot and the shared secret across container restarts.
    volumes:
      - ./loot:/app/loot
      - ./secret.key:/app/secret.key:ro
      # Optional: mount your own TLS cert instead of using --tls auto-gen
      # - ./cert.pem:/app/cert.pem:ro
      # - ./key.pem:/app/key.pem:ro

    # Pass arguments to server.py.  LHOST is mandatory.
    # Remove --tls if you don't need TLS (or add --cert / --key for manual certs).
    command: ["-lh", "${LHOST:-127.0.0.1}", "-p", "4444", "--tls"]

    # Keep STDIN open so the interactive console works with `docker compose run`.
    stdin_open: true
    tty: true

    # Restart policy — remove or change to "no" if you don't want auto-restart.
    restart: unless-stopped

    # Health-check: verify the listener port is accepting TCP connections.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',4444)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
